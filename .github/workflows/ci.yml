name: GeoLens CI

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '22'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. Java Compile (Go golangci-lint karşılığı — derleme + paket sınırları)
  # ===========================================================================
  compile:
    name: Java Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./platform/java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile (jOOQ codegen + derleme)
        run: sh mvnw -B -q compile

  # ===========================================================================
  # 2. Java Build + Test (Go build/test karşılığı — tek jar, 955+ test)
  # ===========================================================================
  build-test:
    name: Java Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./platform/java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests
        run: sh mvnw -B test

      - name: Package jar (api/worker/scheduler profilleri)
        run: sh mvnw -B -q package -DskipTests

  # ===========================================================================
  # 3. Frontend Build + Test
  # ===========================================================================
  web-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./platform/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: platform/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build

  # ===========================================================================
  # 4. Specification Lint (markdown validation)
  # ===========================================================================
  spec-check:
    name: Spec Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint specification markdown
        run: markdownlint 'specification/**/*.md' --ignore 'specification/docs/04-whitepapers/' || echo "Spec lint warnings found (non-blocking)"
        continue-on-error: true

  # ===========================================================================
  # 5. Docker Build (on merge to main) — java/Dockerfile (api/scheduler/worker)
  # ===========================================================================
  docker:
    name: Docker Build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [compile, build-test, web-build, spec-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ./platform/java/Dockerfile
          target: api
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Scheduler
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ./platform/java/Dockerfile
          target: scheduler
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-scheduler:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-scheduler:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ./platform/java/Dockerfile
          target: worker
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-worker:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: ./platform/web
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-web:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # 6. Security Scan (Trivy)
  # ===========================================================================
  security:
    name: Security Scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
