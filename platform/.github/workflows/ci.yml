name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: platform

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gosec
        uses: securego/gosec@master
        with:
          working-directory: platform
          args: -no-fail ./...
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: platform/
          format: table
          exit-code: 0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests (short)
        working-directory: platform
        run: go test ./... -v -count=1 -short

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: geolens
          POSTGRES_PASSWORD: geolens
          POSTGRES_DB: geolens
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run integration tests
        working-directory: platform
        env:
          DATABASE_URL: postgres://geolens:geolens@localhost:5432/geolens?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: go test ./... -v -count=1 -tags=integration

  secrets-validate:
    name: Secrets Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check age key setup
        run: |
          if [ -f platform/docker/.env.secrets.enc ]; then
            echo "Secrets file exists, checking age config..."
            if [ -f platform/.sops.yaml ]; then
              echo ".sops.yaml found"
            fi
            echo "NOTE: Full decryption requires AGE_KEY secret — set in GitHub repo Settings > Secrets"
          else
            echo "No encrypted secrets file found — skipping"
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build API
        working-directory: platform
        run: go build ./cmd/api
      - name: Build Scheduler
        working-directory: platform
        run: go build ./cmd/scheduler
      - name: Build Worker
        working-directory: platform
        run: go build ./cmd/worker
