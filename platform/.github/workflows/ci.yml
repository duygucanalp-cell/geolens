name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: "25"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Compile (derleme kontrolü)
        working-directory: java
        run: ./mvnw -B -q compile

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: platform/
          format: table
          exit-code: 0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Run tests
        working-directory: java
        run: ./mvnw -B test

  secrets-validate:
    name: Secrets Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check age key setup
        run: |
          if [ -f docker/.env.secrets.enc ]; then
            echo "Secrets file exists, checking age config..."
            if [ -f .sops.yaml ]; then
              echo ".sops.yaml found"
            fi
            echo "NOTE: Full decryption requires AGE_KEY secret — set in GitHub repo Settings > Secrets"
          else
            echo "No encrypted secrets file found — skipping"
          fi

  ml-eval:
    name: ML Eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ML deps
        run: |
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Pytest
        run: pytest
      - name: Gold dataset eval (8-intent per-sınıf F1 dahil)
        env:
          # Sıkı mod: 0421-8INTENT 8-intent model per-sınıf F1 eşiği ve legacy
          # eval zorunlu — eksik veri/model veya eşik altı sınıf CI'yı kırar.
          ML_REQUIRE_MODELS: "1"
        run: |
          python -m geolens.eval.main

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build jar (api/worker/scheduler profilleri tek jar)
        working-directory: java
        run: ./mvnw -B -q package -DskipTests
