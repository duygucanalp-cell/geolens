# golangci-lint configuration — GeoLens Platform (v2)
# Reference: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

output:
  formats:
    text:
      path: stdout
      colors: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - misspell
    - cyclop
    - gocritic
    - bodyclose
    - noctx
    - whitespace
  settings:
    cyclop:
      max-complexity: 35
    misspell:
      locale: US
      ignore-rules:
        - "performans"
        - "paralel"
        - "adres"
        - "personel"
        - "cancelled"
        - "güncellen"
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: var-naming
        - name: package-comments
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - cyclop
          - gocritic
          - noctx
      - path: _test\.go
        text: "unused-parameter"
        linters:
          - revive

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
