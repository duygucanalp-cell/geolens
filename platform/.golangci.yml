# golangci-lint configuration — GeoLens Platform (v2)
# Reference: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true

issues-exit-code: 1

output:
  formats:
    colored-line-number:
      print-issued-lines: true
      print-linter-name: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - misspell
    - cyclop
    - gocritic
    - bodyclose
    - noctx
    - whitespace
  settings:
    cyclop:
      max-complexity: 35
    misspell:
      locale: US
      ignore-words:
        - "performans"
        - "paralel"
        - "adres"
        - "personel"
        - "cancelled"
        - "güncellen"
    revive:
      rules:
        - name: blank-imports
        - name: var-naming
        - name: package-comments
      severity: warning

formatters:
  enable:
    - gofmt

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - cyclop
        - gocritic
        - noctx
    - path: _test\.go
      text: "unused-parameter"
      linters:
        - revive
  max-issues-per-linter: 0
  max-same-issues: 0
