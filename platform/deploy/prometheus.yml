# GeoLens Platform — Prometheus Scrape Config
# Prometheus, API'nin /metrics endpoint'inden metrikleri toplar
# Grafana: http://localhost:4000 (admin/admin)

global:
  scrape_interval:     15s
  evaluation_interval: 15s

# Alerting rules — ML serving devre kesici cooldown (prometheus-rules.yml)
rule_files:
  - '/etc/prometheus/prometheus-rules.yml'

scrape_configs:
  - job_name: 'geolens-api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Worker — kendi prosesindeki metrikler (queue depth, engine calls,
  # ML breaker sentiment/measure component'leri). 0421 M-4 gözlemlenebilirlik.
  - job_name: 'geolens-worker'
    static_configs:
      - targets: ['worker:8081']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Scheduler — kendi prosesindeki metrikler (cron/dispatcher iş yükü).
  - job_name: 'geolens-scheduler'
    static_configs:
      - targets: ['scheduler:8082']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
