# GeoLens Platform — Prometheus Scrape Config
# Prometheus, API'nin /metrics endpoint'inden metrikleri toplar
# Grafana: http://localhost:4000 (admin/admin)

global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'geolens-api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
