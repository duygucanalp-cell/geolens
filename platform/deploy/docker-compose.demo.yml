# GeoLens Demo — Tek node demo ortamı
# Kullanım: docker compose -f deploy/docker-compose.demo.yml up -d

version: "3.8"

services:
  # === Infrastructure ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: geolens
      POSTGRES_PASSWORD: geolens
      POSTGRES_DB: geolens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geolens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Application ===
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://geolens:geolens@postgres:5432/geolens?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: geolens-snapshots					JWT_SECRET: demo-secret-change-in-production
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      CHATGPT_API_KEY: ${CHATGPT_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-geolens@example.com}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-GeoLens}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
      target: scheduler
    environment:
      DATABASE_URL: postgres://geolens:geolens@postgres:5432/geolens?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: geolens-snapshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://geolens:geolens@postgres:5432/geolens?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: geolens-snapshots					PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      CHATGPT_API_KEY: ${CHATGPT_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-geolens@example.com}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-GeoLens}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
