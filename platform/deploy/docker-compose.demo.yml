# GeoLens Demo — Tek node demo ortamı
# Kullanım: docker compose -f deploy/docker-compose.demo.yml up -d

version: "3.8"

services:
  # === Infrastructure ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: geolens
      POSTGRES_PASSWORD: geolens
      POSTGRES_DB: geolens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geolens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Application ===
  # ML serving — breaker metriklerinin (geolens_ml_breaker_*) kaynağı.
  # Prometheus MLServingUnavailable kuralı bu servise bağımlıdır.
  ml-serving:
    build:
      context: ../ml
      dockerfile: Dockerfile
    ports:
      - "8900:8900"
    environment:
      ML_MODEL_DIR: /models
      ML_SENTIMENT_TOKENIZER_DIR: /models/sentiment/tokenizer
      MODELS: "sentiment=/models/sentiment/sentiment.onnx,prompt_intent=/models/prompt_classifier/prompt_intent.onnx,prompt_topic=/models/prompt_classifier/prompt_topic.onnx,prompt_persona=/models/prompt_classifier/prompt_persona.onnx,prompt_funnel=/models/prompt_classifier/prompt_funnel.onnx"
      # A2-5 LLM-as-Judge (opsiyonel): boşsa kural tabanlı fallback (M-1)
      GEOLENS_JUDGE_API_KEY: ${GEOLENS_JUDGE_API_KEY:-}
      GEOLENS_JUDGE_MODEL: ${GEOLENS_JUDGE_MODEL:-gpt-4o-mini}
      GEOLENS_JUDGE_BASE_URL: ${GEOLENS_JUDGE_BASE_URL:-}
      GEOLENS_JUDGE_THRESHOLD: ${GEOLENS_JUDGE_THRESHOLD:-3}
    volumes:
      - ../ml/models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8900/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # === Java uygulaması (Spring Boot — api/worker/scheduler profilleri, tek jar) ===
  api:
    build:
      context: ..
      dockerfile: java/Dockerfile
      target: api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: api
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/geolens
      DATABASE_USER: geolens
      DATABASE_PASSWORD: geolens
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: geolens
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JWT_SECRET: demo-secret-change-in-production
      # ML serving (0421 A0-3) — serving yoksa kural tabanlı fallback (M-4)
      ML_SERVING_URL: http://ml-serving:8900
      ML_TIMEOUT: 5s
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      CHATGPT_API_KEY: ${CHATGPT_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      COPILOT_API_KEY: ${COPILOT_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: geolens@example.com
      SENDGRID_FROM_NAME: GeoLens
      # ========== SOPS+Age ==========
      AGE_KEY: ${AGE_KEY:-}
    volumes:
      - ../docker/.env.secrets.enc:/etc/geolens/secrets/.env.secrets.enc:ro
      - ../docker/age-key.txt:/etc/geolens/secrets/age-key.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ml-serving:
        condition: service_started

  scheduler:
    build:
      context: ..
      dockerfile: java/Dockerfile
      target: scheduler
    environment:
      SPRING_PROFILES_ACTIVE: scheduler
      DATABASE_URL: jdbc:postgresql://postgres:5432/geolens
      DATABASE_USER: geolens
      DATABASE_PASSWORD: geolens
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CONSUMER_GROUP: cg:measure
      # ========== SOPS+Age ==========
      AGE_KEY: ${AGE_KEY:-}
    volumes:
      - ../docker/.env.secrets.enc:/etc/geolens/secrets/.env.secrets.enc:ro
      - ../docker/age-key.txt:/etc/geolens/secrets/age-key.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: java/Dockerfile
      target: worker
    environment:
      SPRING_PROFILES_ACTIVE: worker
      DATABASE_URL: jdbc:postgresql://postgres:5432/geolens
      DATABASE_USER: geolens
      DATABASE_PASSWORD: geolens
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CONSUMER_GROUP: cg:measure
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: geolens
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JWT_SECRET: demo-secret-change-in-production
      # ML serving — serving yoksa kural tabanlı fallback (M-4)
      ML_SERVING_URL: http://ml-serving:8900
      ML_TIMEOUT: 5s
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      CHATGPT_API_KEY: ${CHATGPT_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      COPILOT_API_KEY: ${COPILOT_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: geolens@example.com
      SENDGRID_FROM_NAME: GeoLens
      # ========== SOPS+Age ==========
      AGE_KEY: ${AGE_KEY:-}
    volumes:
      - ../docker/.env.secrets.enc:/etc/geolens/secrets/.env.secrets.enc:ro
      - ../docker/age-key.txt:/etc/geolens/secrets/age-key.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ml-serving:
        condition: service_started

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  # === H14: Monitoring Stack ===
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "4000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD=geolens-overview
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus

  elasticsearch:
    image: elasticsearch:8.17.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    ports:
      - "8123:8123"
      - "9004:9000"
    environment:
      - CLICKHOUSE_DB=geolens
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    volumes:
      - chdata:/var/lib/clickhouse

volumes:
  pgdata:
  miniodata:
  promdata:
  grafanadata:
  esdata:
  chdata:
