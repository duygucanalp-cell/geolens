[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geolens-ml"
version = "0.1.0"
description = "GeoLens makine öğrenimi katmanı — serving, feature extraction, PoC prototipleri"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "onnxruntime>=1.16",
    "pydantic>=2.5",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.25",
    "ruff>=0.3",
    "transformers>=4.36",
    "torch>=2.1",
    "datasets>=2.14",
    "accelerate>=1.1",
    "onnx>=1.15",
    "skl2onnx>=1.16",
    "onnxscript>=0.1",
    # A1-2 gerçek veri etiketleme pipeline'ı: export_unlabeled.py PostgreSQL
    # erişimi için (measure.raw_responses → etiketlenmemiş gold şablonları).
    "psycopg[binary]>=3.1",
    # A2-5 LLM-as-Judge: GEOLENS_JUDGE_API_KEY yapılandırıldığında OpenAI-uyumlu
    # chat completions çağrısı için (import lazy — key yoksa kurulması gerekmez).
    "openai>=1.30",
]

[dependency-groups]
# A2-1 sentiment eğitimi: transformers Trainer + torch.onnx.export gerektirir.
train = ["transformers[torch]>=4.36", "accelerate>=1.1", "onnxscript>=0.1"]

[tool.setuptools.packages.find]
include = ["geolens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]