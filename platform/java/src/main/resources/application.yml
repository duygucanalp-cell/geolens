spring:
  application:
    name: geolens
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/geolens}
    username: ${DATABASE_USER:geolens}
    password: ${DATABASE_PASSWORD:geolens}
    hikari:
      maximum-pool-size: 10
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
  # Varsayılan profil api — worker/scheduler profilleri SPRING_PROFILES_ACTIVE ile seçilir.
  profiles:
    default: api
  # Go docker-entrypoint-initdb.d karşılığı: platform/migrations/*.sql'in V-prefix
  # kopyası src/main/resources/db/migration altında Flyway ile uygulanır.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # DDL değişikliklerinde mevcut ortamı zorla bozmamak için validate yumuşak tutulur.
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # REDIS_URL (redis://host:port/db) formatı desteklenir — compose/kubernetes geçişi için
      url: ${REDIS_URL:}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,threaddump

# Redis Stream kuyruğu — Go platform/queue (q:measure, q:governance) karşılığı.
queue:
  poll-ms: ${QUEUE_POLL_MS:30000}          # outbox dispatcher tarama aralığı (Go POLL_INTERVAL)
  block-ms: ${QUEUE_BLOCK_MS:5000}         # XREADGROUP BLOCK süresi
  batch-size: ${QUEUE_BATCH_SIZE:10}       # her okumada alınacak mesaj sayısı
  consumer-group: ${CONSUMER_GROUP:cg:measure}
  consumer-name: ${CONSUMER_NAME:worker-1}
  panel-scan-ms: ${QUEUE_PANEL_SCAN_MS:60000}  # scheduler panel cron tarama aralığı
  dispatcher-enabled: ${QUEUE_DISPATCHER_ENABLED:true}
  workers-enabled: ${QUEUE_WORKERS_ENABLED:true}

recommendation:
  batch:
    # Go worker'da ölçüm tamamlanınca tetiklenen Evaluate() akışının planlı batch karşılığı.
    # Varsayılan kapalı; açmak için: recommendation.batch.enabled=true + workspaces="WS01:T01,WS02:T01"
    enabled: ${RECOMMENDATION_BATCH_ENABLED:false}
    workspaces: ${RECOMMENDATION_BATCH_WORKSPACES:}
    interval-ms: ${RECOMMENDATION_BATCH_INTERVAL_MS:900000}
    initial-delay-ms: ${RECOMMENDATION_BATCH_INITIAL_DELAY_MS:60000}

sentiment:
  ml:
    # ML serving URL'si boşsa kural tabanlı analiz çalışır (0421 M-4 fallback).
    serving-url: ${ML_SERVING_URL:}
    timeout-ms: ${ML_TIMEOUT:5000}
    breaker-cooldown-ms: ${ML_BREAKER_COOLDOWN:60000}

measure:
  ml:
    # Prompt intent sınıflandırması (0421 A3-3). Boşsa varsayılan GAVF ağırlıkları kullanılır.
    classify-url: ${ML_CLASSIFY_URL:}
    timeout-ms: ${ML_TIMEOUT:5000}
